apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tetris

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

images:
  - name: svishal25/tetris
    # Written by the bump-manifest job in .github/workflows/release.yml on every
    # release. This line IS the deploy trigger: Argo CD syncs on git diffs, so
    # :latest would mean the manifest never changes and no release ever ships.
    newTag: v2.0.0
